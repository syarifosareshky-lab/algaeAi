<!DOCTYPE html>
<html>
<head>
    <title>Algae AI | Control</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; }
        .card { background: #1e293b; border: none; border-radius: 15px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .stat-card { border-left: 5px solid #3b82f6; padding: 15px; }
        .btn-primary { background: #3b82f6; border: none; padding: 12px; font-weight: bold; }
    </style>
</head>
<body>
<div class="container py-5">
    <h2 class="text-info mb-4 text-center">Desmodesmus AI Optimizer</h2>
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card p-4">
                <form id="aiForm">
                    <label class="form-label">Container ID (Tab Name)</label>
                    <input type="text" name="container" class="form-control mb-3" placeholder="Bio_A" required>
                    
                    <div class="row">
                        <div class="col-6">
                            <label class="form-label">pH Reading</label>
                            <input type="number" step="0.1" name="ph" class="form-control mb-3" required>
                        </div>
                        <div class="col-6">
                            <label class="form-label">Nitrate (ppm)</label>
                            <input type="number" name="nitrate" class="form-control mb-3" required>
                        </div>
                    </div>

                    <label class="form-label">Current Volume (ml)</label>
                    <input type="number" name="volume" class="form-control mb-3" value="10000">

                    <input type="hidden" name="environment" value="1">
                    <button type="submit" class="btn btn-primary w-100 mt-2">RUN AI ANALYSIS</button>
                </form>
            </div>
        </div>

        <div class="col-md-6">
            <div id="results" style="display:none;">
                <div class="card stat-card">
                    <h6 class="text-info">Carbon Source (Pineapple Juice)</h6>
                    <h3 id="pineRes">--</h3>
                    <small id="predRes" class="text-secondary"></small>
                </div>
                <div class="card stat-card" style="border-left-color: #10b981;">
                    <h6 class="text-success">Nutrient Action</h6>
                    <h4 id="kno3Res">--</h4>
                </div>
                <div class="card stat-card" style="border-left-color: #ef4444;">
                    <h6 class="text-danger">Safety Alert</h6>
                    <h5 id="phWarn">--</h5>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    document.getElementById('aiForm').onsubmit = async (e) => {
        e.preventDefault();
        const res = await fetch('/process', { method: 'POST', body: new FormData(e.target) });
        const data = await res.json();
        if(data.status === 'success') {
            document.getElementById('results').style.display = 'block';
            document.getElementById('pineRes').innerText = "Add " + data.pineapple;
            document.getElementById('predRes').innerText = data.prediction;
            document.getElementById('kno3Res').innerText = data.kno3;
            document.getElementById('phWarn').innerText = data.ph_warn;
        } else { alert("Error: " + data.message); }
    };
</script>
</body>
</html>
